<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A&amp;F Style Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2323438A'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='14' text-anchor='middle' fill='white'%3EAF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: two-pane spec board — watchlist rail on the left, the selected style's sheet on the right; numbers set in mono like a cutting ticket. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#141C29; --muted:#5B6576; --line:#DCE0E6;
  --accent:#23438A; --accent-ink:#FFFFFF; --accent-soft:#E2E8F5;
  --good:#1E7A4C; --warn:#A86300; --bad:#B42318; --good-soft:#E3F2EA; --warn-soft:#FBEFD9; --bad-soft:#FBE6E3;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --sunk:#111821; --ink:#E5E9EF; --muted:#93A0B3; --line:#263142;
  --accent:#8FA9EA; --accent-ink:#0E131A; --accent-soft:#1C2944;
  --good:#4FC48C; --warn:#E3A43C; --bad:#F2766B; --good-soft:#12291F; --warn-soft:#2B2210; --bad-soft:#2E1616; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --sunk:#111821; --ink:#E5E9EF; --muted:#93A0B3; --line:#263142;
  --accent:#8FA9EA; --accent-ink:#0E131A; --accent-soft:#1C2944;
  --good:#4FC48C; --warn:#E3A43C; --bad:#F2766B; --good-soft:#12291F; --warn-soft:#2B2210; --bad-soft:#2E1616; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-stretch:78%;margin:0;text-wrap:balance;letter-spacing:.005em}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
header.top h1{font-size:30px;font-weight:800;line-height:1.05}
header.top h1 span{color:var(--accent)}
header.top p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)}

/* add bar */
.addbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 320px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.hint{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.msg{font-size:13px;padding:8px 10px;border-radius:var(--r)}
.msg.ok{background:var(--good-soft);color:var(--good)} .msg.err{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--accent)}
.linklike{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* bookmarklet panel */
.bm{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:10px}
.bm ol{margin:0;padding-left:20px;display:grid;gap:4px;max-width:80ch}
.bmlink{display:inline-block;background:var(--ink);color:var(--surface);padding:7px 12px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px;cursor:grab}
.bmrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* main grid */
.main{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:10px;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 12px;align-items:start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 8px 8px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item .ph{grid-row:1/3}
.item .nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .sub{grid-column:2/4;display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.item .px{text-align:right;font-size:13px;white-space:nowrap}
.ph{display:block;width:48px;aspect-ratio:4/5;max-width:100%;border-radius:4px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.sm{width:28px}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.anf{color:var(--ink)} .tag.hol{color:var(--accent)}
.delta{font-family:var(--f-mono);font-size:12px}
.delta.dn{color:var(--bad)} .delta.up{color:var(--good)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);display:grid;gap:6px}
.empty b{color:var(--ink)}

/* queue */
.queue{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.qrow .u{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)} .pill.done{background:var(--good-soft);color:var(--good)} .pill.error{background:var(--bad-soft);color:var(--bad)}

/* sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.sheet section{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.sheet section:first-child{border-top:0}
.shead{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start}
.shead h2{font-size:26px;font-weight:800;line-height:1.1}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.hero{display:flex;gap:14px;align-items:flex-start;min-width:0}
.ph.lg{width:96px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-size:12px;background:var(--surface);white-space:nowrap}
.chip b{font-weight:600}
.chip .num{color:var(--muted)}
.gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gallery figure{margin:0;flex:0 0 96px;display:flex;flex-direction:column;gap:4px}
.gallery .ph{width:96px}
.gallery figcaption{font-size:11px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
.gallery figcaption b{display:block;color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .v small{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .v.bad{color:var(--bad)} .kpi .v.good{color:var(--good)}
@media (max-width:700px){.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sechead h3{font-size:17px;font-weight:700}

/* grid */
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.inv{border-collapse:collapse;width:100%;font-size:12px;min-width:max-content}
table.inv th,table.inv td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.inv thead th{position:sticky;top:0;background:var(--sunk);font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:11px}
table.inv th.c,table.inv td.c{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.inv thead th.c{background:var(--sunk);z-index:2}
table.inv td.cell{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:52px}
table.inv td.zero{color:var(--bad);font-weight:600}
table.inv tr.tot td{font-weight:700;background:var(--sunk);border-bottom:0}
table.inv tr.tot td.c{background:var(--sunk)}
.cname{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:none}
.cprice{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.cprice.md{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.ramp{display:inline-block;width:80px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--surface),var(--accent));border:1px solid var(--line);vertical-align:middle}

/* curve */
.curve{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:12px}
.crow .bar{height:12px;background:var(--sunk);border-radius:2px;position:relative;overflow:hidden}
.crow .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.crow .bar i.sold{background:var(--warn)}
.crow .k{font-family:var(--f-mono);font-weight:600}
.crow .n{font-family:var(--f-mono);text-align:right;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}

/* chart + log */
.chart svg{width:100%;height:auto;display:block}
.chart .axis{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.log{display:flex;flex-direction:column;font-size:13px}
.log .ev{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.log .ev:last-child{border-bottom:0}
.log .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.log .e{display:flex;flex-wrap:wrap;gap:4px 10px}
.k-price{color:var(--bad);font-weight:600}
.tag.sea{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.viewbar{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;align-items:center}
.viewbar .seg button{padding:8px 16px;font-size:13px}
table.inv td.cell small{display:block;color:var(--muted);font-size:10px;font-weight:400}
table.inv tr.grp td{background:var(--sunk);font-weight:700;text-align:left;font-family:var(--f-body);font-size:12px;letter-spacing:.04em}
table.inv tr.sub td{font-weight:700;border-bottom:2px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;max-width:280px;white-space:normal}
.linkbtn:hover{color:var(--accent);text-decoration:underline}
.wnote{font-size:12px;color:var(--muted);margin:0;max-width:80ch}
@media (max-width:600px){.linkbtn{max-width:140px;font-size:12px}}
#weekly .chart{max-width:900px} .k-new{color:var(--good);font-weight:600} .k-out{color:var(--warn);font-weight:600}

/* spec */
.spec{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.spec dt{color:var(--muted)} .spec dd{margin:0;overflow-wrap:anywhere}
.codes{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:12px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:var(--r)}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,.btn{transition:border-color .12s}}

.adminp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.adminp input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:5px 10px;font-size:12px;width:160px}
.status .linklike{font-size:12px;margin-left:6px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>A&amp;F <span>Style Tracker</span></h1>
      <p data-i="sub"></p>
    </div>
    <div class="topright">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText"></span>
        <button type="button" class="linklike" id="adminBtn"></button>
        <button type="button" class="linklike" id="adminOut" hidden data-i="ad_out"></button></div>
      <form id="adminForm" class="adminp" hidden autocomplete="off">
        <input id="adminKey" type="password" data-ph="ad_ph">
        <button type="submit" class="btn small" data-i="ad_go"></button>
        <span class="note" id="adminMsg" role="status"></span>
      </form>
    </div>
  </header>

  <form class="addbar" id="addForm" autocomplete="off">
    <label class="label" for="addInput" data-i="add_label"></label>
    <div class="addrow">
      <input id="addInput" name="addInput">
      <button class="btn primary" type="submit" id="addBtn" data-i="add_btn"></button>
    </div>
    <div id="addMsg" hidden></div>
    <div class="hint">
      <span data-i="hint_data"></span>
      <span data-i="hint_url"></span>
      <button type="button" class="linklike" id="bmToggle" aria-expanded="false" data-i="bm_toggle"></button>
      <a class="linklike" href="/guide.html" target="_blank" rel="noopener" data-i="bm_guide"></a>
    </div>
    <div class="bm" id="bmPanel" hidden>
      <ol><li data-ih="bm_1"></li><li data-ih="bm_2"></li><li data-ih="bm_3"></li></ol>
      <div class="bmrow">
        <a class="bmlink" id="bmLink" href="#" data-i="bm_link"></a>
        <button type="button" class="btn small" id="bmCopy" data-i="bm_copy"></button>
        <span class="note" id="bmCopyMsg"></span>
      </div>
      <textarea id="bmCode" readonly hidden rows="3" style="width:100%;font-family:var(--f-mono);font-size:11px"></textarea>
    </div>
  </form>

  <div class="viewbar">
    <div class="seg" role="group" aria-label="View" id="viewSeg">
      <button type="button" data-view="styles" aria-pressed="true" data-i="v_styles"></button>
      <button type="button" data-view="weekly" aria-pressed="false" data-i="v_weekly"></button>
    </div>
  </div>

  <div class="main" id="mainView">
    <aside class="rail">
      <div class="filters">
        <div class="seg" role="group" aria-label="Brand" id="brandSeg">
          <button type="button" data-brand="all" aria-pressed="true" data-i="f_all"></button>
          <button type="button" data-brand="anf" aria-pressed="false">A&amp;F</button>
          <button type="button" data-brand="hol" aria-pressed="false">Hollister</button>
        </div>
        <div class="seg" role="group" aria-label="Vendor" id="seaSeg">
          <button type="button" data-sea="all" aria-pressed="true" data-i="g_all"></button>
          <button type="button" data-sea="sea" aria-pressed="false" data-i="g_sea"></button>
          <button type="button" data-sea="other" aria-pressed="false" data-i="g_other"></button>
        </div>
        <input class="search" id="q" type="search">
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main class="sheet" id="sheet"></main>
  </div>
  <div class="sheet" id="weekly" hidden></div>
</div>

<script src="/bm.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
const fmtN = n => n == null ? '–' : Number(n).toLocaleString('en-US');
const fmt$ = n => n == null ? '–' : '$' + (Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));

/* ---------- language ---------- */
const I18N = {
  ko: {
    sub: 'Abercrombie & Fitch · Hollister 상품의 컬러 × 사이즈별 재고 수량, 가격·할인, 소재를 모아 보고, 수집할 때마다 쌓이는 이력으로 판매 추정과 가격 변동을 봅니다.',
    st_wait: '연결 중…', st_on: '저장소 연결됨', st_off: '저장소 연결 안 됨', st_lost: '저장소 연결이 끊겼습니다',

/* ---------- derived ---------- */
function stats(s){
  const cs = s.colors || [];
  const offers = cs.map(c => c.offer).filter(v => v != null), lists = cs.map(c => c.list).filter(v => v != null);
  const skus = cs.flatMap(c => c.skus || []);
  const md = cs.filter(c => c.list && c.offer != null && c.offer < c.list);
  return { units: sum(skus.map(k => k.inv)), colors: cs.length,
    minO: offers.length ? Math.min(...offers) : null, maxO: offers.length ? Math.max(...offers) : null, maxL: lists.length ? Math.max(...lists) : null,
    mdColors: md.length, deepest: md.length ? Math.max(...md.map(c => 1 - c.offer / c.list)) : 0,
    out: skus.filter(k => k.inv === 0).length, skus: skus.length };
}
function diffHist(a, b){
  let sold = 0, recv = 0, rev = 0; const ev = [];
  const ids = new Set([...Object.keys(a.c || {}), ...Object.keys(b.c || {})]);
  ids.forEach(id => {
    const x = (a.c || {})[id], y = (b.c || {})[id];
    if (!x && y) { ev.push({ k: 'new', t: t('ev_new') + ' ' + y.n }); return; }
    if (x && !y) { ev.push({ k: 'out', t: t('ev_gone') + ' ' + x.n }); return; }
    if (x.o != null && y.o != null && x.o !== y.o) ev.push({ k: 'price', t: y.n + ' ' + fmt$(x.o) + ' → ' + fmt$(y.o) });
    let outs = 0, sc = 0;
    Object.keys(Object.assign({}, x.s, y.s)).forEach(sz => {
      const p = x.s[sz] || 0, q = y.s[sz] || 0;
      if (q < p) sc += p - q; else if (q > p) recv += q - p;
      if (p > 0 && q === 0) outs++;

    sold += sc; rev += sc * (y.o || 0);
    if (outs) ev.push({ k: 'out', t: y.n + ' ' + t('ev_out', outs) });

function logHtml(hist){

    const parts = ['<span class="mono">' + esc(t('units_n', hist[i].units)) + ' <span class="delta ' + (du < 0 ? 'dn' : du > 0 ? 'up' : '') + '">(' + (du > 0 ? '+' : '') + fmtN(du) + ')</span></span>'];
    if (d.sold) parts.push('<span>' + esc(t('h_sold')) + ' ' + fmtN(d.sold) + '</span>');
    if (d.recv) parts.push('<span>' + esc(t('h_recv')) + ' +' + fmtN(d.recv) + '</span>');
    d.ev.forEach(e => parts.push('<span class="k-' + e.k + '">' + esc(e.t) + '</span>'));

  rows.push('<div class="ev"><span class="d">' + esc(hist[0].date) + '</span><span class="e"><span class="mono">' + esc(t('units_n', hist[0].units)) + '</span><span>' + esc(t('h_first')) + ' · ' + esc(t('colors_n', Object.keys(hist[0].c).length)) + '</span></span></div>');

}
function chart(hist){
  const W = 720, H = 180, L = 56, R = 56, T = 14, B = 26;
  const xs = hist.map(h => new Date(h.date).getTime()), x0 = Math.min(...xs), x1 = Math.max(...xs);
  const us = hist.map(h => h.units), uMax = (Math.max(...us) * 1.08) || 1;
  const ps = hist.map(h => { const o = Object.values(h.c).map(c => c.o).filter(v => v != null); return o.length ? Math.min(...o) : null; });
  const pv = ps.filter(v => v != null), pMax = pv.length ? Math.max(...pv) * 1.1 : 1;
  const X = v => L + (x1 === x0 ? (W - L - R) / 2 : (v - x0) / (x1 - x0) * (W - L - R));
  const Y = u => T + (1 - u / uMax) * (H - T - B);
  const YP = p => T + (1 - p / pMax) * (H - T - B);
  let g = [0, .5, 1].map(f => Math.round(uMax * f)).map(v => '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)" stroke-width="1"/><text class="axis" x="' + (L - 6) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + fmtN(v) + '</text>').join('');
  const line = hist.map((h, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(h.units).toFixed(1)).join(' ');
  g += '<path d="' + line + ' L' + X(xs[xs.length - 1]).toFixed(1) + ' ' + Y(0) + ' L' + X(xs[0]).toFixed(1) + ' ' + Y(0) + ' Z" fill="var(--accent)" fill-opacity=".10"/><path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  if (pv.length) g += '<path d="' + hist.map((h, i) => ps[i] == null ? '' : ((i && ps[i - 1] != null) ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + YP(ps[i]).toFixed(1)).join(' ') + '" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  const li = hist.length - 1;
  g += '<circle cx="' + X(xs[li]) + '" cy="' + Y(us[li]) + '" r="4" fill="var(--accent)"/>';
  if (ps[li] != null) g += '<text class="axis" x="' + (W - R + 6) + '" y="' + (YP(ps[li]) + 3) + '" style="fill:var(--bad)">' + fmt$(ps[li]) + '</text>';
  g += '<text class="axis" x="' + L + '" y="' + (H - 8) + '">' + esc(hist[0].date) + '</text><text class="axis" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">' + esc(hist[li].date) + '</text>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('ch_aria')) + '">' + g + '</svg><div class="legend"><span><span style="display:inline-block;width:14px;height:2px;background:var(--accent);vertical-align:middle"></span> ' + esc(t('ch_units')) + '</span><span><span style="display:inline-block;width:14px;border-top:2px dashed var(--bad);vertical-align:middle"></span> ' + esc(t('ch_price')) + '</span></div>';
}

function weeklyOf(s){

function weeklyModel(){

  if (firstWk) { const keep = weeks.filter(w => w >= firstWk); weeks = keep.length >= 4 ? keep : weeks.slice(-4); }

  $('#addMsg').hidden = true; applyStatic(); render();
}));
$('#brandSeg').addEventListener('click', e => { const b = e.target.closest('button[data-brand]'); if (!b) return; state.brand = b.dataset.brand; document.querySelectorAll('[data-brand]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderList(); });
$('#q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (!b) return; state.sel = b.dataset.key; state.sec = 'all'; state.confirmDel = false; render(); if (window.matchMedia('(max-width:900px)').matches) $('#sheet').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
$('#sheet').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const s = state.styles.find(x => x.key === state.sel); if (!s) return;
  if (b.dataset.sec) { state.sec = b.dataset.sec; renderSheet(); return; }
  if (b.id === 'seaToggle') {
    const j = await admin(s.seaa ? 'unmark' : 'mark', s.key);
    if (j.ok) { s.seaa = !s.seaa; showMsg('ok', t(s.seaa ? 'm_sea_on' : 'm_sea_off', s.name)); render(); } else showMsg('err', t('m_seafail'));
    return;
  }
  if (b.id === 'del') { state.confirmDel = true; renderSheet(); return; }
  if (b.id === 'delNo') { state.confirmDel = false; renderSheet(); return; }
  if (b.id === 'delYes') {
    const j = await admin('delete', s.key);
    if (j.ok) { state.styles = state.styles.filter(x => x.key !== s.key); state.sel = null; state.confirmDel = false; showMsg('ok', t('m_deleted', s.name)); render(); }
    else showMsg('err', t('m_delfail'));
    return;
  }
  if (b.id === 'reqRefresh') {
    b.disabled = true; b.textContent = t('capturing');
    const j = await captureUrl(s.url);
    if (j.ok) { showMsg('ok', t('m_refreshed', j.style.name, j.hist.units)); await loadAll(); state.histKey = null; render(); }
    else { showMsg('err', t('m_cap_err', j.error)); b.disabled = false; b.textContent = t('b_refresh'); }
    return;
  }
  if (b.id === 'csv') {
    const rows = [['brand','style','collection_id','color','color_family','store_item','size','sku','inventory','status','offer_usd','list_usd','captured_at']];
    s.colors.forEach(c => c.skus.forEach(k => rows.push([s.brand, s.name, s.collectionId, c.color, c.family, c.storeItem, k.label || k.p, k.sku, k.inv, k.status, c.offer, c.list, s.capturedAt])));
    const csv = '\ufeff' + rows.map(r => r.map(v => { const x = v == null ? '' : String(v); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',')).join('\n');
    downloadCsv((s.brand + ' ' + s.name + ' ' + s.date).replace(/[\\/:*?"<>|&]+/g, '').replace(/\s+/g, '_') + '.csv', csv);
  }
});


/* ---------- data ---------- */
async function api(path, opts){
  try { const r = await fetch(path, opts); return await r.json().catch(() => ({ ok: false, error: 'http_' + r.status })); }
  catch (e) { return { ok: false, error: 'network' }; }
}
async function loadAll(){
  const since = addDays(weekStart(todayStr()), -7 * 10);
  const [a, b] = await Promise.all([api('/api/styles'), api('/api/daily?since=' + since)]);
  state.loaded = true; state.loadedAt = Date.now();
  if (!a.ok) { setStatus(false, 'st_off'); return false; }
  state.styles = a.styles; state.daily = {};
  (b.ok ? b.daily : []).forEach(d => { (state.daily[d.key] = state.daily[d.key] || {})[d.date] = d; });
  if (state.sel && !state.styles.some(s => s.key === state.sel)) state.sel = null;
  setStatus(true, 'st_on');
  return true;
}
function loadHist(key){
  if (state.histKey === key) return;
  state.histKey = key; state.hist = [];
  api('/api/history?key=' + encodeURIComponent(key)).then(j => {
    if (state.histKey !== key) return;
    state.hist = j.ok ? j.history : [];
    if (state.sel === key && state.view === 'styles') renderSheet();
  });
}
const captureUrl = url => api('/api/capture', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url }) });
const admin = (action, key) => api('/api/admin', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': state.admin || '' }, body: JSON.stringify({ action, key }) });
function downloadCsv(name, text){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function setStatus(on, key){ state.statusKey = key; $('#dot').className = 'dot ' + (on ? 'on' : 'off'); $('#statusText').textContent = t(key); }
function applyAdmin(){ $('#adminBtn').textContent = state.admin ? t('ad_on') : t('ad_btn'); $('#adminOut').hidden = !state.admin; }
try { state.admin = localStorage.getItem('anf-admin') || ''; } catch (e) {}
$('#adminBtn').addEventListener('click', () => { const f = $('#adminForm'); f.hidden = !f.hidden; $('#adminMsg').textContent = ''; if (!f.hidden) $('#adminKey').focus(); });
$('#adminOut').addEventListener('click', () => { state.admin = ''; try { localStorage.removeItem('anf-admin'); } catch (e) {} applyAdmin(); render(); });
$('#adminForm').addEventListener('submit', async e => {
  e.preventDefault();
  state.admin = $('#adminKey').value.trim();
  const j = await admin('check');
  if (j.ok) { try { localStorage.setItem('anf-admin', state.admin); } catch (x) {} $('#adminForm').hidden = true; $('#adminKey').value = ''; showMsg('ok', t('ad_ok')); }
  else { state.admin = ''; $('#adminMsg').textContent = t('ad_bad'); }
  applyAdmin(); render();
});
window.addEventListener('focus', () => { if (Date.now() - state.loadedAt > 60000) loadAll().then(render); });
applyStatic(); render();
loadAll().then(() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && state.styles.some(s => s.key === h)) state.sel = h;
  render();
});
})();
</script>
</body>
</html>
